<main class="auth-page">
  <form mat-card class="auth-card" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
    <p class="auth-brand">
      <span class="brand-fit">Fit</span><span class="brand-book">Book</span>
    </p>
    <h1>Login</h1>
    <p class="auth-hint">Sign in to continue.</p>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
      />
      @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
        <mat-error>Enter a valid email.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        id="password"
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hidePassword = !hidePassword"
        [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
      >
        <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
        <mat-error>Enter your password.</mat-error>
      }
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="isLoading"
      [attr.aria-busy]="isLoading"
    >
      @if (isLoading) {
        <mat-spinner diameter="18"></mat-spinner>
        Signing in...
      } @else {
        Login
      }
    </button>

    <p class="auth-hint">
      New member?
      <a routerLink="/register">Register</a>
    </p>
  </form>
</main>
