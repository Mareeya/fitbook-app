<nav class="shell-nav">

  @if (isAdmin()) {
    <a routerLink="/admin/trainers" routerLinkActive="active">Trainers</a>
    <a routerLink="/admin/classes" routerLinkActive="active">Classes</a>
  }

  }

</nav>
